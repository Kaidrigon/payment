
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment System Test Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.5;
      color: #222;
    }

    h2 { margin-bottom: 8px; }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0;
    }

    .product label { flex: 1; }

    input[type="number"] {
      width: 65px;
      padding: 8px;
    }

    button {
      padding: 12px 18px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1664d9;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #total {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f3f4f6;
      padding: 14px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h2>Payment System Test Checkout</h2>
  <p>Select one or more test products and choose their quantities.</p>

  <div class="product">
    <label for="qty1">
      <strong>Test Product</strong><br>
      ₹100.00 each
    </label>
    <input id="qty1" type="number" min="0" max="100" value="1">
  </div>

  <div class="product">
    <label for="qty2">
      <strong>Test Product 2</strong><br>
      ₹250.00 each
    </label>
    <input id="qty2" type="number" min="0" max="100" value="0">
  </div>

  <div id="total">Total: ₹100.00</div>

  <button id="pay-button">Create Order &amp; Pay</button>
  <pre id="result">Ready to test.</pre>

  <script>
    // Update this if your ngrok URL changes.
    const API = "https://2fe6-2409-40d6-415-785e-19fe-6ac9-8f63-a58.ngrok-free.app";

    const result = document.getElementById("result");
    const button = document.getElementById("pay-button");
    const qty1 = document.getElementById("qty1");
    const qty2 = document.getElementById("qty2");
    const total = document.getElementById("total");

    function getQuantity(input) {
      const value = Number(input.value);

      if (!Number.isInteger(value) || value < 0 || value > 100) {
        throw new Error("Quantities must be whole numbers from 0 to 100.");
      }

      return value;
    }

    function getItems() {
      const first = getQuantity(qty1);
      const second = getQuantity(qty2);
      const items = [];

      if (first > 0) {
        items.push({
          product_id: "test-product",
          quantity: first
        });
      }

      if (second > 0) {
        items.push({
          product_id: "test-product-2",
          quantity: second
        });
      }

      if (items.length === 0) {
        throw new Error("Please select at least one product.");
      }

      return items;
    }

    function updateTotal() {
      try {
        const items = getItems();
        let amountPaise = 0;

        for (const item of items) {
          amountPaise +=
            (item.product_id === "test-product" ? 10000 : 25000) *
            item.quantity;
        }

        total.textContent =
          "Estimated total: ₹" + (amountPaise / 100).toFixed(2);
      } catch {
        total.textContent = "Please enter valid quantities.";
      }
    }

    qty1.addEventListener("input", updateTotal);
    qty2.addEventListener("input", updateTotal);

    button.onclick = async function () {
      button.disabled = true;
      result.textContent = "Creating your order...";

      try {
        const items = getItems();

        // 1. Create the order. The backend determines the real prices.
        const orderResponse = await fetch(`${API}/api/orders/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items })
        });

        if (!orderResponse.ok) {
          throw new Error(
            "Could not create order: " + await orderResponse.text()
          );
        }

        const order = await orderResponse.json();

        // 2. Create a Razorpay order through your backend.
        const paymentResponse = await fetch(
          `${API}/api/payments/create/${encodeURIComponent(order.order_id)}`,
          { method: "POST" }
        );

        if (!paymentResponse.ok) {
          throw new Error(
            "Could not create Razorpay order: " +
            await paymentResponse.text()
          );
        }

        const payment = await paymentResponse.json();

        // 3. Open Razorpay Checkout.
        const checkout = new Razorpay({
          key: payment.key_id,
          amount: payment.amount,
          currency: payment.currency,
          name: "Test Store",
          description: "Test order " + order.order_id,
          order_id: payment.razorpay_order_id,

          handler: async function (response) {
            result.textContent =
              "Payment returned by Checkout. Verifying with server...";

            try {
              const verifyResponse = await fetch(
                `${API}/api/payments/verify`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_signature: response.razorpay_signature
                  })
                }
              );

              const responseText = await verifyResponse.text();
              let data;

              try {
                data = JSON.parse(responseText);
              } catch {
                data = { detail: responseText };
              }

              if (!verifyResponse.ok) {
                result.textContent =
                  "Payment status could not be confirmed.\n\n" +
                  JSON.stringify(data, null, 2) +
                  "\n\nCheck Razorpay and MongoDB before retrying.";
              } else if (data.order_marked_paid === true) {
                result.textContent =
                  "PAYMENT CONFIRMED\n\n" +
                  JSON.stringify(data, null, 2);
              } else {
                result.textContent =
                  "Payment is not yet confirmed as paid.\n\n" +
                  JSON.stringify(data, null, 2) +
                  "\n\nCheck the payment status before retrying.";
              }
            } catch (error) {
              result.textContent =
                "Could not reach the verification server: " +
                error.message +
                "\n\nThe payment may still have succeeded. Check its status before retrying.";
            } finally {
              button.disabled = false;
            }
          },

          modal: {
            ondismiss: function () {
              result.textContent =
                "Checkout closed.\n" +
                "The payment may still be pending or processing.\n" +
                "Check the payment status before retrying.";
              button.disabled = false;
            }
          },

          theme: { color: "#1664d9" }
        });

        checkout.on("payment.failed", function (response) {
          const error = response.error || {};

          result.textContent =
            "PAYMENT FAILED\n\n" +
            "Reason: " + (error.description || "Unknown error") + "\n" +
            "Code: " + (error.code || "Not provided") + "\n\n" +
            "Check the final payment status before retrying.";

          button.disabled = false;
        });

        checkout.open();

      } catch (error) {
        result.textContent = "Error: " + error.message;
        button.disabled = false;
      }
    };

    updateTotal();
  </script>
</body>
</html>
